<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Mark Zuckerberg</title>
</head>

<body>
  

  <hr>

  <h1>Donor Information</h1>

  <form action="#" method="post">

   

      <table>
        <tr>
          <td><label for="firstName">First Name*</label></td>
          <td><input type="text" id="firstName" name="firstName" required></td>
        </tr>
        <tr>
          <td><label for="lastName">Last Name*</label></td>
          <td><input type="text" id="lastName" name="lastName" required></td>
        </tr>
        <tr>
          <td><label for="company">Company</label></td>
          <td><input type="text" id="company" name="company" ></td>
        </tr>
        <tr>
          <td><label for="address1">Address 1*</label></td>
          <td><input type="text" id="address1" name="address1" required></td>
        </tr>
        <tr>
          <td><label for="address2">Address 2</label></td>
          <td><input type="text" id="address2" name="address2"></td>
        </tr>
        <tr>
          <td><label for="city">City*</label></td>
          <td><input type="text" id="city" name="city" required></td>
        </tr>
        <tr>
          <td><label for="state">State*</label><br></td>
          <td><select id="state" name="state">
              <option value="">Select a State</option>
              <option value="dhaka">Dhaka</option>
              <option value="chittagong">Chittagong</option>
              <option value="rajshahi">Rajshahi</option>
            </select></td>
        </tr>
        <tr>
          <td><label for="zip">Zip Code*</label></td>
          <td><input type="zip" id="zip" name="city"  pattern=[A-Za-z]{3,}required></td>
        </tr>
        <tr>
          <td><label for="country">Country*</label><br></td>
          <td><select id="country" name="country">
              <option value="">Select a State</option>
              <option value="bangladesh">Bangladesh</option>
              <option value="india">India</option>
              <option value="nepal">Nepal</option>
            </select></td>
        </tr>
        <tr>
          <td><label for="phone">Phone</label></td>
          <td><input type="number" id="phone" name="phone"></td>
        </tr>
        <tr>
          <td><label for="fax">Fax</label></td>
          <td><input type="number" id="fax" name="fax"></td>
        </tr>
        <tr>
          <td><label for="email">Email*</label></td>
          <td><input type="email" id="email" name="email"></td>
        </tr>
        <tr>
          <td><label>Donation Amount*</label></td>
          <td>
            <label><input type="radio" name="donation" value="none"> None</label>
            <label><input type="radio" name="donation" value="50"> $50</label>
            <label><input type="radio" name="donation" value="75"> $75</label>
            <label><input type="radio" name="donation" value="100"> $100</label>
            <label><input type="radio" name="donation" value="250"> $250</label>
            <label><input type="radio" name="donation" value="other"> Other</label>
          </td>
        </tr>
        
        <tr>
          <td></td>
          <td><button type="reset">Reset</button></td>
        </tr>
      </table>
  </form>

  <hr>

  <footer>
    <p><small>&copy; 2026 Mark Zuckerberg</small></p>
  </footer>

</body>

</html>
