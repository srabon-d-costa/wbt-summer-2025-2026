<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Assesment - Form</title>
</head>

<body>
    <hr>

    <h1>Registration</h1>
    <form action="#" method="post">
        <div class="field">
            <label for="Full name">Full Name</label>
            <input type="text" id="FN" name="Full name" placeholder="Jane Roew" required>
        </div>
        <div class="field>
            <label for="Postal Code">Postal Code</label>
            <input type="number" id="PC" name="Postal Code" placeholder="23566" required>
        </div>
        <div class="field">
            <label for="Date of Birth">Date of Birth</label></td>
            <input type="date" id="DoB" name="Date of Birth" placeholder="23/04/2004" required>
        </div>
        <div class="field">
            <label for="Email">Email</label></td>
            <input type="email" id="Email" name="Email" placeholder="abcxy23@gmail.com">
        </div>
        <div class="field">
            <label for="Password">Password</label></td>
            <input type="password" id="Password" name="Password" placeholder="*******">
        </div>
        <div class="field">
            <label for="Country">Country</label><br>
            <select id="C" name="Country">
                    <option value="">Select a Country</option>
                    <option value="Bangladesh">Job</option>
                    <option value="India">Projects</option>
                    <option value="Nepal">Thesis</option>
                </select>
        </div>
        <div class="field">
            <button type="Submit" class="primary">Submit</button>
            <button type="Reset" class="secondary">Reset</button>
        </div>

    </form>


    </hr>
</body>
